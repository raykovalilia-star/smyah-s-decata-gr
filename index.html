          {q:`Το παιδί έχει δυο υποχρεώσεις προς την μητέρα του:<br>Να την ηρεμίσει όταν αυτή θυμώνει.<br>Να την εκνευρίσει όταν αυτή είναι ήσυχη.<br>Η δασκάλα ρωτάει:<br>-Τόνι, πώς και έγραψες ότι  τα χελιδόνια έχουν καθίσει στα καλώδια της ΔΕΗ σαν σουτζουκάκια;<br>Ε, κυρία… πεινούσα!`},

          {q:`Στο σχολείο εξήγησαν το βάρος και το ύψος των παιδιών.<br>Η Μελίνα επιστρέφει στο σπίτι και ρωτάει την γιαγιά της:<br>Γιαγιά πόσα κιλά είσαι;<br>72 κιλά με τα γυαλιά παιδί μου.<br>Και χωρίς τα γυαλιά;<br>Χωρίς αυτά δεν ξέρω, δεν βλέπω την ζυγαριά.`},

          {q:`Στο μαγαζί για τα παιχνίδια ένα παιδί θέλει να πάρει ένα μεγάλο αμάξι. Η μητέρα αρνείται να το αγοράσει και το παιδί αρχίζει να κλαίει δυνατά. Σε λίγο καιρό σταματάει.<br>Σ’ ευχαριστώ που σταμάτησες να κλαις, αυτό το αμάξι δεν είναι καλό και εσύ έχεις πολλά στο σπίτι! – υπερήφανη του λέει η κυρία.`},

          {q:`Στο μάθημα της γυμναστικής:<br>Τόνι κάμε μια γέφυρα!<br>Εγώ δεν είμαι οικοδόμος κύριε. – απάντησε ο Τόνι.`},
          {q:`Ο Άλεξ πάει επίσκεψη στον φίλο του τον Ανέστη. Ανοίγει το ψυγείο και βλέπει άδεια μπουκάλια από αναψυκτικά.<br>Ανέστη, γιατί έχετε άδεια μπουκάλια στο ψυγείο;<br>Για να κερνάω φίλους που δεν θέλουν τίποτα να πίνουν.`},
          {q:`Στο τέλος τις καλοκαιρινές διακοπές η μητέρα του παιδιού που θα πάει Τρίτη τάξη λέει:<br>Οι διακοπές πέρασαν. Τι θα πεις στην κυρία; Tι διάβασες;<br>Μαμά, μην στεναχωριέσαι!Διαβάζω κάθε μέρα – όταν είμαι στο μαγαζί διαβάζω τις ετικέτες. Ξέρεις πόσες ετικέτες έχει εκεί.`},
          {q:`H γιαγιά επιστρέφει στο σπίτι που γίνεται χαμός: στο πάτωμα υπάρχουν παντού πεταμένα βιβλία, ρούχα, φαγητά, …<br>Τρομαγμένη ρωτάει τον παππού:<br>Μπήκανε κλέφτες; Μας κλέψανε;<br>Όχι ήρθαν τα εγγόνια για λίγο.`},
          {q:`Η μαμά θυμώνει στο παιδί:<br>Γιατί ήπιές όλο το μπουκάλι με την Coca Cola; Αφού ξέρεις πως δεν σε επιτρέπω!<br>Μαμά, έχασα το καπάκι και φοβόμουν να μην χυθεί.`},
          {q:`Μετά από το μάθημα Μαθηματικών η δασκάλα ρωτάει:<br>Γιάννη, τι θυμάσαι;<br>Πάντα να έχω ένα κρατούμενο κυρία!`},
          {q:`Ο πατέρας μαλώνει τον γιο του:<br>Γιε μου, δεν έχει τίποτα στο κεφάλι σου! Άκου, είναι κούφιο! – και χτυπάει με τα δάχτυλα στο τραπέζι…<br>Μπαμπά, κάποιος χτυπάει την πόρτα!<br>Κάτσε εδώ γιε μου. Θα πάω να ανοίξω! – σηκώθηκε ο πατέρας.`},
          {q:`O Nίκος παρακαλεί την μαμά του να του πάρει παιχνίδια από το μαγαζί. Η μαμά του αρνείται και τότε αυτός την καθησυχάζει :<br>Μαμά, μην στεναχωριέσαι, θα σου δώσω τα χρήματα όταν επιστρέψουμε στο σπίτι! Μετά θα βγάλω καινούργια χρήματα.<br>Από που θα τα βγάλεις;<br>‘Όταν πάω στην γιαγιά αυτή μου δίνει - 5 λέβα, 10 λέβα… Έτσι βγαίνουν τα λεφτά μαμά!`},
          {q:`Η μητέρα μπαίνει στο δωμάτιο των παιδιών:<br>Παιδιά, το δωμάτιο σας φαίνεται χάλια σαν το ντουλάπι με τα παιχνίδια φτερνίστηκε και η ντουλάπα έκανε εμετό …`},
          {q:`Η νονά πήγε επίσκεψη να δει τον βάψιμο της . και τον ρωτάει:<br>Πόσα χρήματα έβαλες από τα Κάλαντα;<br>Πολλά! – απάντησε το παιδί.<br>Πρέπει να αγοράσεις κάτι, γιατί ο πληθωρισμός θα σου φάει τα χρήματα! – του λέει αυτή.<br>Δεν πειράζει εγώ δεν τον ξέρω τον πληθωρισμό, ούτε αυτός ξέρει που θα με βρει! – με σιγουριά απαντάει το παιδί.`},
          {q:`-Γιαγιά αυτά τα σουτζουκάκια μάλλον είναι χαλασμένα. Δεν είμαι καλά – λέει το παιδάκι στην γιαγιά του.<br>Πόσα έφαγες παιδί μου;<br>12, γιαγιά και 3 φέτουλες ψωμί`},
          {q:`Η γιαγιά λέει στο εγγόνι της :<br>Άρη, αύριο πρέπει να γυρίσουμε τα ρολόγια πίσω.<br>Γιαγιά δεν γίνεται μου αρέσει πολύ το δικό μου και δεν θυμάμαι από που μου το πήρε ο μπαμπάς!`},
          {q:`H μαμά και κόρη ετοιμάζονται να φύγουν:<br>Μαμά, που θα πάμε;<br>Σήμερα ανοίγουν μια έκθεση στο κέντρο.<br>Νομίζεις μαμά πως θα ενδιαφερθεί κάποιος να μας δει;`},
          {q:`Παιδί παίρνει τηλέφωνο την αστυνομία<br>Η αστυνομία είναι; Εδώ με κρατάνε με το ζόρι!<br>Που βρίσκεστε;<br>Στο σχολείο.`},
          {q:`Ένα πρωί ο οδοντογιατρός έρχεται στο ιατρείο και ρωτάει τη νοσοκόμα αν έχουν έρθει ασθενείς.<br>Ναι, ο πρώτος είναι 12 χρονών αγόρι θα πρέπει να του βγάλουμε το φρονιμίτη.<br>Καλά, ας μπούμε μέσα. – είπε ο γιατρός.<br>Δεν μπορούμε έχει κλειδωθεί μέσα !`},
          {q:`Ένα βράδυ το παιδί ρωτά την μαμά του:<br>Μαμά μπορείς να μου δώσεις ένα κομμάτι σοκολάτα;<br>Όχι! – είπε η μαμά.<br>Αχ, σε αγαπάω πολύ! Και εγώ δεν ήθελα μόνο ένα αλλά μια ολόκληρη σοκολάτα.`},
          {q:`Δυο αδελφάκια 9 και 12 χρονών πήγαν επίσκεψη στην γιαγιά.<br>Το ένα τρέχει προς αυτή και κλαίει:<br>Γιαγιά, ο αδελφός μου με χτύπησε με την καρέκλα!<br>Η γιαγιά άρχισε να φωνάζει:<br>Θοδωρή, γιατί χτύπησες τον αδελφό σου με την καρέκλα;<br>Γιατί το τραπέζι ήταν βαρύ και δεν μπόρεσα να το σηκώσω!`},
          {q:`O παππούς λέει στο εγγόνι του:<br>Πρέπει να τρως περισσότερο! Κάθε μέρα τουλάχιστον 5 φορές.<br>Γιατί παππού;<br>Για να μεγαλώσεις.<br>Τότε εσύ γιατί τρως; Μεγάλωσες πια!`},
          {q:`Η μαμά γυρνάει στο σπίτι μετά το κομμωτήριο και νομίζει πως είναι πολύ όμορφη με το καινούργιο κοντό μαλλί.<br>Την συναντά η κόρη της:<br>Ο, μαμά μην στεναχωριέσαι! Το μαλλί σου γρήγορα θα μεγαλώσει και θα γίνεις πάλι όμορφη!`},
          {q:`Η μαμά φωνάζει στα παιδιά:<br>Παιδιά, βαρέθηκα με αυτά τα Lego! Είναι παντού στο πάτωμα!<br>Μαμά, βάλε παντόφλες! Δεν μπορούμε να μαζεύουμε κάθε μέρα!`},
          {q:`H γιαγιά ρωτάει το εγγόνι της:<br>Ποιο είναι το πιο δύσκολο πράγμα στο σχολείο παιδί μου;<br>Το πρωινό ξύπνημα γιαγιά.`},
          {q:`Η μαμά λύνει τις ασκήσεις με το πρωτάκη της:<br>Άλεξ, έχεις 20 καραμέλες. Πόσες θα σου μείνουν αν δώσεις στην αδελφή σου 7;<br>19, μαμά.<br>Πως το υπολόγισες;<br>Δεν είμαι τρελός να της δώσω 7, θα της δώσω 1 και θα μου μείνουν 19.`},
          {q:`Η κυρία ρωτάει τον Θοδωρή ποιος έχει λύσει τις ασκήσεις του.<br>Δεν ξέρω κυρία, είχα ξεχάσει το τετράδιο μου στην γιαγιά και εκεί μένουν πέντε άτομα, δεν ξέρω ποιος  απ’ όλους ήταν...`},
          {q:`Την ώρα των Μαθηματικών η κυρία κάνει παρατήρηση στον Τόνι:<br>Τόνι, μην σφυρίζεις, όταν λύνεις τις ασκήσεις !<br>Δεν λύνω ασκήσεις κυρία, απλά σφυρίζω.`},
          {q:`Το βράδυ το παιδί ρωτάει τον πατέρα του:<br>Mπαμπά, γιατί δεν μπορούμε να βλέπουμε τηλεόραση όσο τρώμε;<br>Γιατί στην τηλεόραση δεν αρέσει να βλέπει ανθρώπους που τρώνε.`},
          {q:`Η μαμά ρωτάει τον γιό της:<br>Γιατί διαβάζεις το βιβλίο της Ιστορίας ανάποδα;<br>Τι σημασία έχει μαμά, αφού όλα είναι παρελθόν…`},
          {q:`O πατέρας είναι για ψάρεμα με τα παιδιά.<br>Μπαμπά, βάλε μου ένα σκουλήκι!<br>Μπαμπά, βράχηκε το παπούτσι μου!<br>Μπαμπά, πού είναι το νερό;<br>Μπαμπά έχουμε κάτι άλλο να φάμε;<br>Μπαμπά, μπαμπά σήμερα είναι η μέρα σου!<br>Μπαμπά, γιατί είσαι τόσο καλό ψαράς;<br>Γιατί τα ψάρια είναι περίεργα και αναρωτιούνται ποιος είναι αυτός<br>«Μπαμπά, μπαμπά, μπαμπάκα…» και πιάνονται για το αγκίστρι για να με δουν.<br>Το πρωτάκη γυρνάει στο σπίτι μετά από την πρώτη μέρα στο σχολείο και η μαμά τον ρωτάει:<br>Πώς πέρασε η μέρα σου Ανέστη;<br>Πολύ καλά, αλλά νομίζω αύριο δεν θα πάω.<br>Γιατί;<br>Γιατί πλέον ξέρω τα πάντα!`},
          {q:`Η μαμά ρωτάει το παιδί :<br>Πώς πέρασες την ημέρα σου στο σχολείο;<br>To παιδί απαντάει:<br>Φοβερά, μαμά! Κέρδισα βραβείο για το πιο ήσυχο και αργό διάβασμα.`},
          {q:`Στο σχολείο η δασκάλα ρωτά:<br>Ποιος μπορεί να μου πει ποιος είναι ο μικρότερος αριθμός; O μικρός Γιωργάκης λέει:<br>Ο βαθμός μου στα Μαθηματικά κυρία!`},
          {q:`Η δασκάλα μουσικής ρωτάει τα παιδιά:<br>Τι σημαίνει ορχήστρα;<br>Ο μικρός Πέτρος απαντάει:<br>Η ορχήστρα είναι μια ομάδα ανθρώπων που παίζουν μουσική μαζί και μπροστά τους κάθεται ο διευθυντής της και κουνάει μια σκυτάλη για να μην κοιμηθούν !`},
          {q:`Μπαμπά, γιατί λες πάντα ότι είμαι το μικρό σου αστέρι;<br>Ο πατέρας απαντά:<br>Γιατί είσαι πολύ δυνατός κάθε βράδυ όταν σου ζητάω να κοιμηθείς, και το πρωί έχεις σβήσει, όταν πρέπει να σηκωθείς!`},
          {q:`Ένας μαθητής ρωτά τον καθηγητή Μαθηματικών:<br>Κυρία, αν έχω 5 μήλα στο ένα χέρι και 6 στο άλλο, τι έχω;<br>Μεγάλα χέρια, Γιαννάκη!`},
          {q:`Η 10χρονη Ντάρια ρωτάει τη μητέρα της:<br>Μαμά, μπορώ να προσκαλέσω την Έμμα να κοιμηθεί απόψε εδώ και να κάνουμε πιζάμα πάρτι;<br>Φυσικά, αγάπη μου, θα χαρώ να διασκεδάσετε. Σου ζητώ μόνο πιο μπροστά να διπλώσεις τα ρούχα σου, να καθαρίσεις το δωμάτιό σου και να βάλεις νέα σεντόνια στο άλλο κρεβάτι.<br>Η Ντάρια βιάζεται να τηλεφωνήσει στην Έμμα.<br>Έμμα, δυστυχώς δεν θα μπορέσεις να έρθεις απόψε! Η μαμά δεν το επιτρέπει.`},
          {q:`Η δασκάλα μαλώνει δυο ξαδέλφια που είναι στην ίδια τάξη:<br>Βαγγέλη, η έκθεση σου με θέμα «Οι χειμερινές μου διακοπές», είναι ακριβώς ίδια με της ξαδέλφης σου, της Έμα. Την έχεις αντιγράψει!<br>Όχι, κυρία, ήμασταν μαζί στις χειμερινές μας διακοπές και μας έτυχαν τα ίδια πράγματα!`},
          {q:`Παιδί ρωτά την μητέρα του:<br>Μαμά, αν είμαι καλός θα μου αγοράσεις παιχνίδι;<br>Ναι, παιδί μου.<br>Μπράβο! Γιατί αν δεν μου αγοράσεις θα γίνω κακός!`},
          {q:`Η δασκάλα ρωτά τους μαθητές:<br>Ποιος μπορεί να μου πει που μένουν τα πιγούνια;<br>Ο Τόνι σήκωσε το χέρι:<br>Στο YouTube, κυρία, τους έχω δει στο κινητό!`},
          {q:`Το παιδί γυρνάει στο σπίτι και λέει στην μητέρα του:<br>Μαμά, σήμερα μάθαμε πως η Γη γυρνάει γύρω από τον Ήλιο.<br>Πώς νιώθεις με αυτή την πληροφορία;<br>Ζαλίζομαι μαμά, απ’ όλες αυτές τις στροφές…`},
          {q:`Ο παππούς λέει στον εγγόνο του:<br>Όταν ήμουν μικρός, πηγαίναμε 5 χλμ. μέχρι το σχολείο.<br>Ο εγγόνος απαντάει:<br>Και εγώ παππού πριν 2 χρόνια κλίκαρα με το ποντίκι μου 5 φορές στο on-line σχολείο!`},
          {q:`Πατέρας και γιος πάνε στα Επείγοντα στο Νοσοκομείο.. Το παιδί είχε φουσκωμένα κόκκινα δαχτυλάκια .<br>Τι κάνατε; – ρώτησε ο γιατρός.<br>Σπιτάκι για τα πουλιά. – απάντησε το παιδί.<br>Τα δαχτυλάκια γιατί είναι έτσι;<br>Εγώ κρατούσα τα καρφιά, και ο μπαμπάς τα χτυπούσε με το σφυρί πάνω στα σανίδια.`},
          {q:`Το παιδί ρωτάει τον πατέρα του:<br>Μπαμπά γιατί για κάποιος ανθρώπους λέμε πως είναι έξυπνοι σαν μπούφος;<br>Γιατί και αυτοί σαν τους μπούφους δεν κοιμούνται όλη νύχτα και σκέφτονται κάποια δύσκολα πράγματα, όπως θεωρίες και ασκήσεις.`},
          {q:`Η μητέρα ρωτά τον γιό της:<br>Πέτρο, ξέρεις γιατί τα μπρόκολα είναι καλά για το μυαλό;<br>Γιατί βάζουν το μυαλό να σκέφτεται πολύ καθαρά έτσι ώστε να βρει έναν τρόπο να μην τα φάει.`},
          {q:`Ο μικρός Γιώργος ρωτά την γιαγιά του:<br>Γιαγιά, γιατί καμιά φορά μιλάς μόνη σου;<br>Για να ακούω καμιά φορά και έξυπνα πράγματα αγάπη μου!`},
          {q:`Το παιδί παραπονιέται στην μητέρα του:<br>Μαμά, γιατί πρέπει να διαβάζω ιστορία; Αυτά πλέον έχουν περάσει!<br>Για να μην επαναλαμβάνεις τα λάθη των προγόνων σου, για παράδειγμα... να μην μαζεύεις τα παιχνίδια σου!`},
          {q:`Ο δάσκαλος μαθηματικών ρωτά τους μαθητές του:<br>Αν έχετε 10 σοκολάτες και σας πάρω 5 τι θα κάνετε;<br>Θα αρχίζω να κλαίω κύριε! – σήκωσε το χέρι του ο Θοδωρής.`},
          {q:`Ο πατέρας λέει στην κόρη του:<br>Ξέρεις, όταν ήμουν σαν εσένα, ήμουν άριστος σ’ όλα τα μαθήματα.<br>Αχ εσύ πάντα έλεγες, “όταν ήμουν εγώ παιδί όλα ήταν εύκολα!” Ήταν όλα εύκολα όχι όπως τώρα!`},
          {q:`Το παιδί ρωτά τον παππού του:<br>Παππού, γιατί φοράς γυαλιά;<br>Για να βλέπω καλύτερα Μάριε.<br>Και τότε γιατί δεν βλέπεις ποτέ που είναι ο τηλεκοντρόλ;`},
          {q:`Κυριακή πρωί είναι το παιδί μπαίνει στο δωμάτιο των γωνιών του και λέει. Έλα μαμά είναι η ώρα να σηκωθείς!<br>Κυριακή είναι, θέλω να κοιμηθώ και ακόμα είναι 6:40 το πρωί!<br>Και εγώ έτσι σε παρακαλώ κάθε μέρα μέσα την εβδομάδα να με αφήσεις να πάω αργότερα στο σχολείο! Άντε, σήκω, σε παρακαλώ, μην με κάνεις να έρθω 10 φορές – θα αργήσεις για τις κρέπες.`},
          {q:`Ο πατέρας βλέπει ένα άλμπουμ με φωτογραφίες με τα παιδιά του:<br>Μπαμπά, ποιος είναι αυτός ο άνθρωπος στις φωτογραφίες με τα γένια;<br>Είμαι εγώ πριν γεννηθείτε<br>Τι έγινε μετά;<br>Άρχισε να σας τσιμπάει μετά όταν σας έπαιρνα αγκαλιά…`},
          {q:`Η μητέρα ρωτά τον γιό της:<br>Γιατί έγραψες στο τετράδιο σου, πώς η αγελάδα είναι το πιο σημαντικό ζώο;<br>Γιατί από το γάλα της κάνουν το παγωτό και την σοκολάτα γάλακτος μαμά!`},
          {q:`H μητέρα εξηγεί:<br>Αν δεν πλένεις τα δόντια σου θα γίνουν κίτρινα με καφέ λεκέδες.<br>Ω ω, να τι έχει γίνει με τις μπανάνες!`},
          {q:`Η γιαγιά λέει στον εγγονό της:<br>Αποστόλη, αν φας όλα σου τα λαχανικά θα έχεις πολλή ενέργεια και θα είσαι γερός!<br>Γιαγιά, τα αφήνω σε σένα τα λαχανικά, γιατί τα έχεις περισσότερη ανάγκη από μένα, αφού μου είπες πως είσαι κουρασμένη.`},
          {q:`Ο πατέρας ρωτάει τον γιο του:<br>Γιατί έβαλες την γάτα στο ψυγείο;<br>Για να δω αν έχει εννιά ζωές στο κρύο μπαμπά!`},
          {q:`Ένας έφηβος γυρνάει στο σπίτι και ρωτάει :<br>Μαμά τι μαγείρεψες σήμερα;<br>Τίποτα παιδί μου!<br>Χθες πάλι ήταν «τίποτα»!<br>Μαγείρεψα για δυο μέρες!`},
          {q:`Δυο  αδελφάκια μιλάνε:<br>Αδελφέ, έχω υπερδύναμη!<br>Ποια είναι αυτή;<br>Μπορώ να κάνω το ψυγείο να λάμπει μόνο με το βλέμμα μου!<br>Αυτός είναι ο αυτόματος αισθητήρας αδελφέ...`},
          {q:`Η μητέρα λέει στην κόρη της:<br>Δεν πρέπει να τρως το παγωτό πριν το μεσημεριανό.<br>Τότε θα το φάω για μεσημεριανό.`},
          {q:`Στην παραλία δυο παιδιά παίζουνε κοντά σε δυο πολύ βαμμένες κυρίες που μιλάνε και πίνουνε κοκτέιλ. Μια από τις κυρίες λέει στον πατέρα  :<br>Παρακαλώ πάρτε το παιδί σας από δω, γιατί φωνάζει πάρα πολύ!<br>Κυρία, αυτό δεν είναι το δικό μου παιδί – λέει ο πατέρας – το δικό μου είναι εκείνο που τώρα σιωπηλά βάζει άμμο στο ποτήρι με το κοκτέιλ.`},
          {q:`Η μητέρα θυμώνει γιατί το παιδί της δεν διαβάζει το μάθημα της Ιστορίας και παίζει στον υπολογιστή :<br>Μαμά, για να μην θυμώνεις, πρώτα χτύπα την πόρτα, μέτρα μέχρι το 5 και μετά μπες, έτσι θα έχω χρόνο να κλείσω τον υπολογιστή και να πάρω το βιβλίο και θα με δεις να διαβάζω.`},
          {q:`Για τις 8 Μαρτίου, την Παγκόσμια ημέρα της γυναίκας, η μαμά ρωτάει το παιδί της:<br>Πρέπει να κάνουμε δώρο στην γιαγιά σου, κάτι καλό για να την κάνει χαρούμενη.<br>Ω, μαμά να της πάρουμε μια καινούργια ποδοσφαιρική μπάλα. Η γιαγιά είναι πολύ χαρούμενη όταν είμαι ευτυχισμένος!`},
          {q:`Ο αστυνόμος σταματάει αμάξι που κυκλοφορεί το βράδυ με κλειστά τα φώτα και βλέπει πως μέσα κάθεται η δασκάλα του από το Δημοτικό:<br>Καλησπέρα κυρία Παπαδοπούλου! Τώρα να γυρίσετε στο σπίτι και να γράψετε 100 φορές στο τετράδιο όμορφα:<br>«Δεν θα οδηγώ ποτέ τη νύχτα με κλειστά φώτα!»<br>Εντάξει Πέτρο, πηγαίνω!`},
          {q:`Το κρυφτό είναι πολύ χρήσιμο παιχνίδι.<br>Γιατί;<br>Όσο έπαιζα με τα παιδιά, βρήκα 5 ευρώ. Κάτω από το κρεβάτι μας, 3 κάλτσες και το δεύτερο κλειδί για το αμάξι, που το ψάχνω εδώ και ένα μήνα…`},

          {q:`Πες μου 3 πράγματα που ελπίζεις πως τα θα μάθεις στο μέλλον.<br>Θέλω να μάθω να κάνω σκείτμπορντ.<br>Ονειρεύομαι να μάθω να παίζω πιάνο.`},
          {q:`Πες μου 3 κατηγορίες κατοικίδιων, που αγαπάς.<br>Μου αρέσουν τα σκυλιά, επειδή είναι πιστά και παιχνιδιάρικα.<br>οι γάτες είναι γλυκές και ανεξάρτητες.`},
          {q:`Πες μου 3 είδη φανταστικών πλασμάτων που μπορείς να φανταστείς.<br>Δράκους, που πετούν και βγάζουν φωτιά<br>. Ψ Νεράιδες που μένουν στο δάσος και έχουν μαγικές δυνάμεις.`},
          {q:`Πες μου 3 πράγματα που θέλεις να κάνεις όταν μεγαλώσεις.<br>Θέλω να γίνω επιστήμονας και να ανακαλύπτω καινούργια πράγματα.<br>Ονειρεύομαι να ταξιδέψω σ’ όλο τον κόσμο.`},
          {q:`Πες μου 3 στιγμές της ημέρας, όπου είναι σημαντικό να πλένεις τα χέρια σου.<br>Πριν το φαγητό για να είναι καθαρά τα χέρια μου<br>Μετά την επιστροφή μου από το σχολείο ή το παιχνίδι έξω.`},
          {q:`Πες μου τρία πράγματα που πρέπει να συμπεριλάβεις στην καθημερινή σου ρουτίνα αυτοφροντίδας.<br>Κάθε μέρα πρέπει να πίνεις αρκετό νερό.<br>Αθλούμαι για να είμαι σε καλή φόρμα`},
          {q:`ΜΠΟΝΟΥΣ<br>Σου προτείνω και τρίτη απάντηση, μπορείς να προτείνεις και άλλες!`},
          {q:`Πες μου 3 τρόπους με τους οποίους μπορείς να λύσεις τα προβλήματα μεταξύ των φίλων σου.<br>Μεσολαβώ στις συζητήσεις, βοηθώντας τον καθένα να εκφράσει την άποψή του χωρίς να δημιουργώ ένταση.<br>Προτείνω συμβιβασμούς ή λύσεις που ικανοποιούν και τα δυο μέρη.<br>Υπενθυμίζω στους φίλους μου πόσο σημαντικοί είναι ο ένας για τον άλλον και τα οφέλη από τη διατήρηση των καλών τους σχέσεων.`},
          {q:`Πες μου 3 πράγματα που μπορείς να κάνεις για να κάνεις το χρόνο που περνάς με την οικογένειά σου ποιο ενδιαφέρον.<br>Σχεδιάζω οικογενειακά ταξίδια ή ταξίδια σε καινούργια και ενδιαφέροντα μέρη.<br>Διοργανώνω θεματικές βραδιές όπως βραδιές ταινιών ή γαστρονομικές βραδιές.<br>Δημιουργώ οικογενειακά έργα  ή χόμπι, στα οποία συμμετέχουν όλοι και δουλεύουν μαζί.`},
          {q:`Πες μου 3 μέρη που πρέπει να είναι καθαρά στο δωμάτιό σου.<br>Το γραφείο μου για να μπορώ να μελετάω και να ζωγραφίζω.<br>Το πάτωμα για να μην υπάρχει σκόνη και σκουπίδια.<br>Το κρεβάτι μου για να είναι άνετο και καθαρό όταν κοιμάμαι.`},
          {q:`Πες μου 3 πράγματα που μπορείς να κάνεις για να είσαι καλός πολίτης.<br>Συμμετέχω στις κοινοτικές πρωτοβουλίες, όπως καθαρισμός πάρκων.<br>Υπακούω στους νόμους της χώρας στην οποία ζω.<br>Παίρνω ενεργό μέρος σε σχολικά και κοινοτικά έργα.`},
          {q:`Πες μου 3 τρόπους με τους οποίους μπορείς να βοηθήσεις κάποιον που νιώθει απογοητευμένος.<br>Του προτείνω να μιλήσουμε και ακούω τους προβληματισμούς του με κατανόηση και ειλικρίνεια.<br>Του προσφέρω συγκεκριμένες δράσεις και βοήθεια, όταν βγω μαζί του βόλτα ή του προτείνω να κάνουμε πράγματα που μπορούν να του φτιάξουν την διάθεση.<br>Του δίνω σιγουριά και βοήθεια , δείχνοντας  του ότι δεν είναι μόνος  σ ’αυτή την κατάσταση.`},
          {q:`Πες μου 3 πράγματα που πρέπει να κάνεις μετά το φαγητό<br>Βουρτσίζω τα δόντια μου και ξεπλένω το στόμα μου για να είναι καθαρό.<br>Βάζω τα βρώμικα πιάτα στο νεροχύτη.<br>Καμιά φορά βοηθάω τη μαμά να καθαρίσει το τραπέζι.`},
          {q:`Πες μου 3 τρόπους που θα σε βοηθήσουν να προστατευτείς από κρυολόγημα.<br>Φοράω ζεστά ρούχα όταν κάνει κρύο έξω.<br>Πλένω τακτικά τα χέρια μου για να μην μπουν μικρόβια στο στόμα μου.<br>Τρώω πολλά φρούτα και λαχανικά, για να έχω δυνατό ανοσοποιητικό σύστημα.`},
          {q:`Πες μου 3 στιγμές που έχεις νιώσει σίγουρος/η και επιτυχημένος /η.<br>Όταν είχα πάρει υψηλό βαθμό στις εξετάσεις μετά από πολύ μεγάλη προσπάθεια και προετοιμασία.<br>Όταν κατάφερα να μάθω κάτι καινούργιο, όπως να οδηγώ ποδήλατο.<br>Όταν συμμετείχα στην σχολική  συναυλία ή  στους αθλητικούς αγώνες, όπου τα πήγα πολύ καλά.`},
          {q:`Πες μου 3 τρόπους με τους οποίους μπορείς να βοηθάς στην συντήρησης της καθαριότητας στο σχολείο.<br>Δεν πετάω τα σκουπίδια στο πάτωμα, αλλά τα βάζω στο καλάθι.<br>Βοηθάω να τακτοποιηθούν οι καρέκλες και τα θρανία μετά τα μαθήματα.<br>Βοηθάω να καθαρίσουμε την τάξη μας αν είναι απαραίτητο.`},
          {q:`Πες μου 3 κανόνες ασφαλείας που πρέπει να ακολουθείτε όταν παίζετε σε εξωτερικούς χώρους.<br>Πάντα παίζω σε μέρος όπου μπορούν να το δουν οι μεγάλοι.<br>Δεν μιλάω με αγνώστους και δεν πηγαίνω πουθενά με αυτούς.<br>Παίζω σε απόσταση ασφαλείας από τους δρόμους.`},
          {q:`Πες μου 3 πράγματα που μπορείς να κάνεις για να βελτιώσεις τις δεξιότητες σου.<br>Ασκούμαι τακτικά και προσπαθώ να μαθαίνω από τα λάθη μου.<br>Αναζητώ ανταπόκριση και συμβουλές από πιο έμπειρα άτομα.<br>Διαβάζω υλικό σχετικό     με τις δεξιότητες που θέλω να αναπτύξω,`},
          {q:`Πες μου 3 πράγματα που μπορείς να κάνεις για να βοηθήσεις κάποιον που βρίσκετε σε κίνδυνο.<br>Απευθύνομαι σε κάποιον ενήλικα ή δάσκαλο εάν κάποιος χρειάζεται βοήθεια.<br>Προσφέρω υποστήριξη και ενθάρρυνση αν κάποιος είναι λυπημένος ή στεναχωρημένος.<br>παρέχω τις πρώτες βοήθειες αν γνωρίζω τι να κάνω, και μόνο για μικροτραυματισμούς.`},
          {q:`Πες μου 3 πράγματα που θα ήθελες να δοκιμάσεις, ακόμα κι αν δεν τα καταφέρνεις στην αρχή.<br>Θέλω να δοκιμάσω να παίξω ένα νέο μουσικό όργανο, όπως πιάνο ή κιθάρα.<br>Θέλω να γράφω ιστορίες ή βιβλία, ακόμα κι αν δεν είναι τέλεια στην αρχή.<br>Θα ήθελα να δοκιμάσω διάφορα αθλήματα όπως αναρρίχηση ή σερφ για να διερευνήσω τα όριά μου.`},
          {q:`Πες μου 3 τρόπους με τους οποίους μπορείς να μοιραστείς την γνώμη ή την ιδέα σου.<br>Με τη συμμετοχή σε συζητήσεις και έργα στο σχολείο.<br>Συγγραφή ιστολόγου ή τήρηση ημερολογίου.<br>Δημιουργώντας έργα τέχνης ή βίντεο.`},
          {q:`Πες μου 3 τρόπους που μπορείς να γίνεις καλός/η αθλητής/ αθλήτρια.<br>Δείχνω σεβασμό στους αντιπάλους μου, είτε κερδίζω, είτε χάνω.<br>Τηρώ τους κανόνες του παιχνιδιού και παίζω δίκαια.<br>Ενθαρρύνω και υποστηρίζω την ομάδα μου, ακόμα και όταν τα πράγματα δεν πάνε καλά.`},
          {q:`Πες μου 3 πράγματα που μπορείς να κάνεις για να νιώθεις καλά με το εαυτό σου.<br>Ασχολούμαι με  τα χόμπι μου, με κάνουν χαρούμενη και σίγουρη.<br>Περνάω χρόνο με τους φίλους και την οικογένεια μου και αυτό με κάνει να νιώθω ότι με αγαπούν.<br>Ακολουθώ έναν υγιεινό τρόπο ζωής, που με βοηθά να μην αρρωσταίνω και να έχω πολλή ενέργεια για παιχνίδι.`},
          {q:`Πες μου 3 τρόπους, με τους οποίους μπορείς να προετοιμαστείς για μια επιτυχημένη μέρα.<br>Οργανώνω τα πράγματά μου από βραδύς για να είμαι έτοιμος/η το πρωί και να μην βιάζομαι.<br>Κοιμάμαι αρκετά και τρώω υγιεινά.`},
          {q:`Ψ Σχεδιάζω τις εργασίες μου και καθορίζω τις προτεραιότητες της ημέρας.`},
          {q:`Πες μου 3 στιγμές, που ένιωσες περήφανος/η και ικανοποιημένος/η από τον εαυτό σου.<br>Όταν βοήθησα έναν φίλο σε δύσκολη κατάσταση και με ευχαρίστησε.<br>Όταν τελείωσα μια μεγάλη σχολική εργασία,για την οποία είχα δουλέψει σκληρά.<br>Όταν πέτυχα προσωπικό ρεκόρ στο άθλημα που εξασκώ.`},
          {q:`Πες μου 3 τρόπους, με τους οποίους μπορείς να βοηθήσεις τους άλλους και να είσαι καλός φίλος.<br>Δείχνω κατανόηση και στηρίζω τους φίλους μου, όταν έχουν προβλήματα.<br>Προσφέρω βοήθεια όταν κάποιος τη χρειάζεται, για παράδειγμα στο σχολείο.<br>Μοιράζομαι τα πράγματα μου και είμαι ειλικρινής στην επικοινωνία.`},
          {q:`Πες μου 3 τρόπους με τους οποίους μπορείς να προστατευτείς από τραυματισμούς στους αθλητικούς αγώνες.<br>Φοράω κατάλληλο προστατευτικό εξοπλισμό όπως κράνος και επιγονατίδες.<br>”Kάνω ζέσταμα” πριν ξεκινήσω να παίζω ή να αθλούμαι.<br>Ακολουθώ τους κανόνες του παιχνιδιού για να αποφύγω επικίνδυνες καταστάσεις.`},
          {q:`Πες μου 3 στόχους που θα ήθελες να πετύχεις στο μέλλον.<br>Θέλω να μάθω μια καινούργια  ξένη γλώσσα, ίσως αγγλικά ή ισπανικά.<br>Επιθυμώ να γίνω μέλος της σχολικής αθλητικής ομάδας.<br>Ονειρεύομαι να ταξιδέψω σε διάφορες χώρες και να δω τον κόσμο.`},
          {q:`Πες μου 3 πράγματα που έμαθες μετά την αντιμετώπιση μιας πρόκλησης.`},
          {q:`Ψ Έμαθα ότι η επιμονή και η υπομονή οδηγούν στην επιτυχία.<br>Συνειδητοποίησα ότι είναι σημαντικό να ζητάω βοήθεια όταν τη χρειάζομαι.<br>Συνειδητοποίησα ότι τα λάθη είναι μέρος της μάθησης και της ανάπτυξης.`},
          {q:`Πες μου 3 πράγματα που σου αρέσει να κάνεις για διασκέδαση και για να απολαμβάνεις τη ζωή.<br>Μου αρέσει να παίζω με τους φίλους μου. Αυτοί πάντα με κάνουν να γελάω.<br>Οι βόλτες στην φύση με ηρεμούν και με κάνουν να νιώθω ελεύθερος/η.<br>Να ακούω μουσική ή να βλέπω τηλεόραση.`},
          {q:`Πες μου 3 καταστάσεις. Στις οποίες μπορείς να δείξεις καλοσύνη και συμπόνια.<br>Όταν κάποιος στην τάξη νιώθει μοναξιά.<br>Όταν βλέπω πως κάποιος έπεσε και χτύπησε<br>Όταν κάποιος από την οικογένειά μου είναι λυπημένος ή άρρωστος.`},
          {q:`Πες μου 3 πράγματα που σου αρέσει να κάνεις, για να διασκεδάσεις την οικογένειά σου.<br>Να τους διαβάζω το “Οδηγός για καλές στιγμές και Γέλιο με τα παιδιά”.<br>Να τους δείχνω το ταλέντο μου και τις ικανότητές μου: χορός, πάλη, μποξ…<br>Λέω σε όλους διασκεδαστικές ιστορίες ή αστεία, για να τους φτιάξω την διάθεση.`},
          {q:`Πες μου 3 στιγμές όταν ένιωσες ευχαριστημένος/η από τον εαυτό σου<br>Όταν πέτυχα  ένα δικό μου στόχο, για παράδειγμα τελείωσα μια δύσκολη εργασία.<br>Όταν οι άλλοι αναγνωρίζουν τα πράγματα που έχω κάνει και με επαινούν για αυτό.<br>Όταν τελείωσα μόνος μου μια περίπλοκη εργασία.`},
          {q:`Πες 3 πράγματα που κάνεις για να φροντίσεις τα κατοικίδιά σου<br>Τα ταΐζω και τους δίνω νερό τακτικά.<br>Παίζω μαζί τους και τα πηγαίνω βόλτα<br>. Ψ Καθαρίζω τακτικά το μέρος που μένουν για να είναι καθαρό και άνετο.`},
          {q:`Πες 3 πράγματα που σε κάνουν μοναδικό<br>Έχω ταλέντο και ζωγραφίζω πολύ ωραία.<br>Γρήγορα μαθαίνω καινούργια πράγματα και είμαι περίεργος.<br>Έχω χιούμορ και μου αρέσει να φτιάχνω την διάθεση των ανθρώπων.`},
          {q:`Πες μου 3 όνειρα που θα ήθελες να πραγματοποιήσεις και πώς σκοπεύεις να τα κάνες πραγματικότητα.<br>Θέλω να γίνω επαγγελματίας αθλητής, για αυτό προπονούμαι σκληρά καθημερινά.<br>Ονειρεύομαι να ταξιδεύω στον κόσμο, για αυτό μαθαίνω ξένες γλώσσες και εξοικονομώ χρήματα.<br>Θέλω να κάνω κάτι ουσιαστικό για να βοηθήσω τους ανθρώπους, για αυτό διαβάζω και μελετώ πολύ.<br>Πες μου 3 τρόπους με τους οποίους τα καταφέρνεις με τις προκλήσεις<br>Βάζω μικρούς, εφικτούς στόχους και προχωράω βήμα βήμα.<br>Αναζητώ βοήθεια και συμβουλές από άτομα που έχουν εμπειρία.<br>Μένω θετικός και δεν τα παρατάω ακόμα κι όταν είναι δύσκολα.`},
          {q:`Πες μου 3 συμβουλές που θα ήθελες να δώσεις σε κάποιον που νιώθει ανασφάλεια.<br>Πίστεψε στον εαυτό σου και στις ικανότητες σου! Μπορείς να πετύχεις πολύ περισσότερα από όσο νομίζεις.<br>Μην συγκρίνεσαι με τους άλλους, ο καθένας έχει την δική του πορεία και ταχύτητα εξέλιξης.<br>Να θυμάσαι ότι όλοι κάνουν λάθη και αυτό είναι μέρος της διαδικασίας μάθησης και ανάπτυξης.`},
          {q:`Πες μου 3 πράγματα που σου αρέσει να μελετάς και να εξερευνάς.<br>Μου αρέσει να μελετώ την επιστήμη, καθώς και ενδιαφέροντα στοιχεία για το διάστημα και τη φύση.<br>Είμαι ενθουσιασμένος με διαφορετικούς πολιτισμούς και γλώσσες, θέλω να μάθω περισσότερα για τον κόσμο.<br>Μου αρέσει η τεχνολογία και η δύναμη που έχει  να αλλάζει το μέλλον.`},
          {q:`Πες μου 3 χαρακτηριστικά για τα οποία αγαπάς τον εαυτό σου.<br>Είμαι περήφανος/η για την καλοσύνη μου και την ικανότητας μου να συμπονώ τους άλλους.<br>Μου αρέσει η αποφασιστικότητα και η επιμονή μου και ότι προσπαθώ πάντα να πετύχω τους στόχους μου.<br>Σέβομαι τη δημιουργικότητα και τη φαντασία μου, με κάνουν μοναδικός/η.`},
          {q:`Πες μου 3 τρόπους με τους οποίους μπορείς να μοιραστείς μια θετική εμπειρία με άλλους.<br>Να είμαι καλό παράδειγμα με τις πράξεις και τα λόγια μου.<br>Να βοηθάω και να υποστηρίζω τους άλλους όταν έχουν ανάγκη.<br>Να μοιράζω γνώσεις και δεξιότητες που μπορεί να βοηθήσουν τους άλλους να αναπτυχθούν.`},
          {q:`Πες μου 3 πράγματα που σε κάνουν να νιώθεις γενναίος/α.<br>Νιώθω γενναίος/α όταν είμαι καλά προετοιμασμένος/η για μια πρόκληση.<br>Όταν τα αγαπημένα μου πρόσωπα πιστεύουν σε μένα και με υποστηρίζουν.<br>Όταν ξεπεράσω τον φόβο μου και δοκιμάσω κάτι καινούργιο.`},
          {q:`Πες μου 3 στόχους που θέλεις να καταφέρεις μέχρι το τέλος της χρονιάς<br>Θέλω να βελτιώσω τους βαθμούς μου στα μαθηματικά.<br>Θέλω να μάθω μια καινούργια δεξιότητα, όπως να κάνω skateboard.<br>Στόχος μου είναι να συμμετάσχω σε ένα σχολικό έργο ή διαγωνισμό.`},
          {q:`Πες μου 3 άτομα στα οποία μπορείτε να απευθυνθείτε όταν χρειάζεστε υποστήριξη.<br>Μπορώ να μιλήσω με τη μαμά ή τον μπαμπά, πάντα με ακούνε και με καταλαβαίνουν.<br>Απευθύνομαι στον καλύτερο μου φίλο, γιατί είμαστε πάντα μαζί στις δύσκολες στιγμές.<br>Μιλάω με τον καθηγητή μου, όταν έχω πρόβλημα στο σχολείο ή χρειάζομαι συμβουλές.`},
          {q:`Πες μου 3 πράγματα που μπορείς να κάνεις για να στηρίξεις κάποιον άλλο.<br>Ακούω προσεκτικά, όταν κάποιος μοιράζεται τα προβλήματα του μαζί μου.<br>Προσφέρω βοήθεια ή συμβουλές εάν μπορώ να φανώ χρήσιμος.<br>. Δημιουργώ μια θετική και χαρούμενη ατμόσφαιρα.`},

          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και ο Κακολογίας</b><br><br>Σ’ ένα μαγικό βασίλειο, όπου κάθε αυγή ήταν μια καινούργια αρχή, ζούσε μια όμορφη νεραϊδούλα, που όλοι την λέγανε Καθωσπρέπει. Αυτή ήταν η φύλακας της καλής συμπεριφοράς και φρόντιζε για την ευτυχία των παιδιών. Στο δικό της χρωματιστό βασίλειο η νεραϊδούλα Καθωσπρέπη σκεφτόταν συχνά τα παιδιά της Γης, που συχνά ξεχνάνε πόσο σημαντικά είναι τα καλά λόγια και οι καλές πράξεις.<br><br>Μια μέρα η Καθωσπρέπη ένιωσε, πως πρέπει να βοηθήσει ένα αγόρι, που όλοι τον φωνάζαν Κακολογίας. Αυτός συχνά έλεγε κακά λόγια στα παιδιά. Ο Κακολογίας κορόιδευε τους άλλους, γιατί σκεφτόταν, πως έτσι θα φαίνεται πιο σπουδαίος.<br><br>Η Καθωσπρέπη κατέβηκε στην Γη και βρήκε τον Κακολογία στην αυλή του σχολείου, ακριβώς πριν πει κακά λόγια σε ένα παιδί. Η φωτεινή νεραϊδούλα έκατσε στον ώμο του και του είπε ψιθυριστά:<br><br>Γεια σου Κακολογία! Ξέρεις πως κάθε λέξη σου έχει δύναμη; Αυτή τη δύναμη μπορείς να την χρησιμοποιήσεις για καλό ή για κακό σκοπό. Οι λέξεις σου μπορούν να είναι σαν τις ακτίνες του Ηλίου, που ζεσταίνουν τις καρδιές των ανθρώπων, ή σαν κρύος αέρας, που κάνει τους ανθρώπους να μαζεύονται και να φεύγουν μακριά σου.<br><br>Ο Κακολογίας κοίταξε την νεραΐδα Καθωσπρέπη με απορία. Ποτέ δεν είχε σκεφτεί για τις λέξεις του με αυτό τον τρόπο.<br><br>Πώς θα νιώσεις, αν κάποιος σου πει κακές λέξεις; Σίγουρα δεν θα νιώσεις καλά. Το ίδιο νιώθουν και οι άλλοι, όταν τους λες κακά λόγια. – συνέχισε η Καθωσπρέπει.<br><br>Αν αρχίζεις να χρησιμοποιήσεις τo λόγo σου για καλό, θα δεις τι θαύμα θα γίνει.<br><br>Την άλλη μέρα ο Κακολογίας αποφάσισε να αλλάξει την συμπεριφορά του. Άρχισε να λέει καλά πράγματα στους συμμαθητές του. Αντί να τους κριτικάρει ως συνήθως, είπε πολύ καλά λόγια για την ζωγραφιά μιας συμμαθήτριάς του:<br><br>Πολύ καλά τα κατάφερες, Θεοδώρα!<br><br>Τα παιδιά άρχισαν να γελάνε μαζί του.<br><br>Μια μέρα όταν όλοι έπαιζαν στην αυλή ο Κακολογίας τυχαία σκόνταψε σε ένα ξύλο και  έκανε μια τούμπα μπροστά σαν ακροβάτης.<br><br>Όλοι άρχισαν να γελάνε και ο Κακολογίας μαζί τους, καταλαβαίνοντας πως είναι καλύτερα να χαίρονται μαζί σου, παρά να σε φοβούνται.<br><br>Από αυτή την στιγμή και στο εξής ο Κακολογίας έγινε Καλολογίας. Αυτός κατάλαβε την δύναμη των καλών λέξεων και πως αυτές μπορούν να αλλάξουν τον κόσμο. Έτσι χάρη στην νεραΐδα Καθωσπρέπει, αυτός έμαθε πως η πραγματική δύναμη έρχεται από την καλοσύνη και την ευγένεια, και όχι από την αγένεια και την επιθετικότητα.<br><br>Εσείς γνωρίζετε τέτοια άτομα σαν τον Κακολογία;<br><br>Τι συμβουλή θα του δίνατε΄;`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και ο Τρομερός</b><br><br>Σ’ ένα μακρινό μαγικό βασίλειο εκεί ανάμεσα στα σύννεφα, η μικρή νεράϊδαΚαθωσπρέπη κοιτούσε τις εργασίες της στο σημειωματάριό της. Η νεραΐδα αυτή ήθελε πολύ να βοηθήσει τα παιδιά να γίνουν καλύτερα και ευτυχισμένα. Είχε χίλα πράγματα να κάνει...χίλια παιδιά είχανε την ανάγκη από την προσοχή της. Και έτσι μια μέρα συνάντησε τον Τρομερό, “το τρομερό παιδί”, σύμφωνα με τα παιδιά στην τάξη του.<br><br>Η Καθωσπρέπη πέταξε προς τη Γη για να ψάξει τον Τρομερό – το παιδί που φημιζόταν για την κακή του την συμπεριφορά. Αυτός κλωτσούσε τους συμμαθητές του, πετούσε τις τσάντες τους και τους κορόιδευε. Κάθε μέρα τα παιδιά λέγανε τα παράπονα τους για τον Τρομερό στους δασκάλους και στους γονείς.<br><br>Η Καθωσπρέπη κατέβηκε από τα σύννεφα και  εμφανίστηκε στην αυλή του σχολείου.   Εκεί είδε  τον Τρομερό  να τραβάει την γλώσσα  ενός παιδιού και αποφάσισε, πως είναι καιρός να τον βοηθήσει να αλλάξει.<br><br>Η Καθωσπρέπη πλησίασε τον Τρομερό και του είπε:<br><br>-Τρομερέ, ξέρεις πως κάθε παιδί είναι ξεχωριστό και μπορεί να φέρει ευτυχία στους ανθρώπους γύρω του; Εσύ επίσης έχεις αυτή την δυνατότητα! Μπορείς να είσαι καλός φίλος! Μπορείς να βοηθάς τους άλλους και να τους κάνεις να χαμογελούν.<br><br>Ο Τρομερός στην αρχή εξεπλάγη από τα λόγια της νεράιδας Καθωσπρέπει, και άρχισε να τα σκέφτεται. Την άλλη μέρα στο σχολείο αυτός έκανε κάτι περίεργο – βοήθησε ένα μικρό κοριτσάκι να σηκώσει την τσάντα του. Μετά έδωσε την μπάλα σε ένα μικρότερο αγόρι, που ντρεπόταν να την ζητήσει. Έπαιζε με τα αγόρια ποδόσφαιρο σ΄ όλο το διάλειμμα, χωρίς να τα κλωτσάει και να τα φτύνει.<br><br>Σύντομα όλοι είδανε την αλλαγή στον Τρομερό. Αυτός άρχισε να βοηθάει τους συμμαθητές του και να τους συμπεριφέρεται καλά. Τα παιδιά άρχισαν να τον συμπαθούν και να χαίρονται όταν είναι στην παρέα τους. Έπαιζαν μαζί του διάφορα παιχνίδια στην αυλή και ήθελαν πάντα να παίζει ποδόσφαιρο μαζί τους.<br><br>Μια μέρα ο Τρομερός προσπάθησε να μιμηθεί την Καθωσπρέπει, σήκωσε τα χέρια και είπε:<br><br>Με μαγικό τρόπο θα  τους κάνω όλους να γελάνε! Αμέσως άρχισε να κάνει διασκεδαστικές και αστείες γκριμάτσες , καθώς περπατούσε σαν κλόουν.<br><br>Όλα τα παιδιά γέλασαν δυνατά και ο Τρομερός συνειδητοποίησε ότι το να κάνεις τους ανθρώπους ευτυχισμένους είναι πολύ καλύτερο από το να τους προσβάλεις.<br><br>Χάρη στη νεράϊδαΚαθωσπρέπει, ο Τρομερός έμαθε την αξία της καλοσύνης και έγινε φίλος με όλους τους συμμαθητές του. Κατάλαβε επίσης πως κάθε παιδί έχει μέσα του καλοσύνη. Οι καλές πράξεις έφεραν ευτυχία όχι μόνο στους άλλους, αλλά και στον εαυτό του. Ο Τρομερός έγινε ευτυχισμένος...<br><br>Εσείς έχετε απαίσιους συμμαθητές;<br><br>Μήπως είστε απαίσιος μαθητής;<br><br>Τι θα λέγατε σε ένα τέτοιο παιδί για να το βοηθήσετε να αλλάξει και να γίνει καλύτερο;`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και ο Χαζούλης</b><br><br>Στο μακρινό βασίλειο της νεραϊδούλας  Καθωσπρέπη η μέρα ήταν Όμορφη. Η Καθωσπρέπη ήταν τόσο μικρούλα, όσο ένα φυλλαράκι από ένα τριφύλλι, αλλά η καρδιά της ήταν τόσο μεγάλη όσο του Ουρανού. Κάθε πρωί η Καθωσπρέπη μάζευε πρωινή δροσιά από τα λουλούδια, για να ετοιμάσει το μαγικό ελιξίριο της χαράς.<br><br>Μακριά από το βασίλειο της Καθωσπρέπει, σε ένα σχολείο της Γης, ήταν ένα αγόρι που τον λέγανε Χαζούλη. Αυτός ήταν γνωστός στο σχολείο ως ο Αιώνιος Γκρινιάρης. Ο Χαζούλης ποτέ δεν χαιρετούσε, δεν έλεγε “Καλημέρα!” και πάντα φαινόταν μελαγχολικός.<br><br>Μια μέρα όταν ο Χαζούλης μπήκε στο δωμάτιο, ξανά χωρίς να χαιρετίσει, ξαφνικά εμφανίστηκε η μικρή νεραϊδούλα Καθωσπρέπη και έκατσε στον ώμο του.<br><br>- Γεια σου, Χαζούλη! – ψιθύρισε αυτή.<br><br>Ξέρεις πως κάθε σου λέξη μπορεί να λειτουργήσει ως ηλιακή ακτίνα για κάποιον; Όταν λες “Καλημέρα” μοιράζεις φως και ζεστασιά.<br><br>Ο Χαζούλης την κοίταξε με αμφιβολία στα μάτια, αλλά στα μάτια της Καθωσπρέπη υπήρχε κάτι μαγικό, που τον έκανε να την πιστέψει. Και αυτός την πίστεψε!<br><br>Το άλλο πρωί το αγόρι βρήκε θάρρος και χαιρέτησε τους γονείς του με ένα “Καλημέρα!”. Αυτοί χαμογέλασαν πλατιά  και ανταποκρίθηκαν στο χαιρετισμό. Στο σχολείο ο Χαζούλης χαιρέτησε τους φύλακες, τους δασκάλους στο διάδρομο και ακόμη και μερικούς συμμαθητές του. Προς έκπληξη του, όλοι του χαμογέλασαν.<br><br>Έτσι ένα πρωί ο Χαζούλης αποφάσισε να κάνει κάτι ακόμα πιο τολμηρό. Έκατσε μπροστά από τον μαύρο πίνακα και φώναξε:<br><br>- Καλημέρα σ’ όλους!<br><br>Όλοι γελάσανε, γιατί ο Χαζούλης μιμούνταν την φωνή του δασκάλου.<br><br>Αυτός έγινε ο πιο διασκεδαστικός και χαμογελαστός ήρωας της τάξης.<br><br>Από τότε ο Χαζούλης δεν ήταν πια ο αιώνιος Θυμωμένος, αλλά το αγόρι που χαιρετάει με χαμόγελο και δέχεται χαμόγελα.<br><br>Εσείς χαιρετάτε το πρωί;<br><br>Χαιρετάτε τους δασκάλους, τις καθαρίστριες, τους φύλακες;<br><br>Χαιρετάτε τους γείτονες; Χαιρετάτε τους ανθρώπους που δουλεύουν στο σουπερμάρκετ;<br><br>Ήσασταν κάποτε σαν τον Χαζούλη;`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και ο Ζωηρούλης</b><br><br>Την τέταρτη μέρα των επίγειων περιπετειών της, η μικρή νεραϊδούλα Καθωσπρέπη αποφάσισε να επισκεφτεί ένα καινούργιο μέρος. Αυτή την φορά η αποστολή της ήταν να βοηθήσει  ένα αγόρι που τον λέγανε Ζωηρούλη. Εκείνη την ημέρα η Καθωσπρέπη αποφάσισε να παρακολουθήσει από κοντά τα παιδιά στην αυλή του σχολείου, κρυμμένη ανάμεσα στα κλαδιά μιας μεγάλης ιτιάς.<br><br>Ο Ζωηρούλης ήταν γνωστός στο σχολείο και στη γειτονιά γιατί συχνά τσακώνονταν με τα άλλα παιδιά. Σκεφτόταν ότι αυτός ήταν ο τρόπος να δείξει στους άλλους τη δύναμη του. Μια μέρα, όταν ο Ζωηρούλης ξανά ετοιμαζόταν να δείξει τη δύναμή του, δίπλα του εμφανίστηκε η νεράϊδαΚαθωσπρέπει.<br><br>- Ζωηρούλη, - άρχισε να μιλάει η Καθωσπρέπη με ήρεμη φωνή - η αληθινή δύναμη δεν είναι να είσαι  κακός, αλλά να είσαι καλός και τολμηρός. Δεν είναι απαραίτητο να χτυπάς τους άλλους, για να σε εκτιμούν και να σε αγαπούν.<br><br>Ο Ζωηρούλης την κοίταξε με απορία. Οι λέξεις της Καθωσπρέπη τον έκαναν να προβληματιστεί.<br><br>- Κοίτα, - συνέχισε η νεραϊδούλα, - οι αληθινοί ήρωες είναι αυτοί που χρησιμοποιούν την δύναμη τους για να βοηθάνε και να προστατεύουν. Η τόλμη να είσαι καλός είναι η μεγαλύτερη δύναμη.<br><br>Από τότε ο Ζωηρούλης άρχισε να βλέπει τον κόσμο με ένα νέο τρόπο. Σταμάτησε να τσακώνεται με τους συμμαθητές του και άρχισε να τους βοηθάει. Όταν κάποιος χρειαζόταν βοήθεια, ο Ζωηρούλης ήταν πάντα εκεί για να τον προστατεύει και να τον υποστηρίζει.<br><br>Ο Ζωηρούλης συνέχισε να δείχνει τη νέα του καλή πλευρά όταν προστάτευε και βοηθούσε τους συμμαθητές του. Μια μέρα όταν όλοι ήταν στην αυλή του σχολείου για διάλειμμα, αυτός αποφάσισε να κάνει κάτι διασκεδαστικό, για να φτιάξει τη διάθεση ολονών.<br><br>Βρήκε μια παλιά εγκαταλειμμένη στολή κλόουν στην αποθήκη  του αθλητικού εξοπλισμού. Την φόρεσε και βγήκε μπροστά στους φίλους του, έκανε αστεία κόλπα και έλεγε αστεία . Ο Ζωηρούλης έκανε αστείες γκριμάτσες και μάλιστα έκανε ένα πολύ αστείο χορό πιγκουίνου, καθώς γλιστρούσε και έπεφτε με πολύ αστείο τρόπο.<br><br>Όλα τα παιδιά γέλασαν από καρδιάς και χειροκρότησαν τον καινούργιο τους φίλο. Ο Ζωηρούλης χαμογέλασε πλατιά και κατάλαβε πως το γέλιο και η καλοσύνη είναι πολύ πιο δυνατοί από την επιθετικότητα.<br><br>Από αυτή την στιγμή και μετά ο Ζωηρούλης έγινε πολύ καλός, και πολύ δημοφιλής. Χάρη στη νεραϊδούλα Καθωσπρέπη έμαθε, ότι η αληθινή δύναμη βρίσκεται στην καρδιά και στην ικανότητα να δίνεις ευχαρίστηση στους άλλους.<br><br>Και έτσι, με τη βοήθεια της μικρής νεραϊδούλας ο Ζωηρούλης έγινε ένας πραγματικός ήρωας στα μάτια όλων – ένας ήρωας που ξέρει να διασκεδάζει και να προστατεύει τους φίλους του.<br><br>Ξέρετε κάποιον σαν τον Ζωηρούλη;`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και η Ζηλιάρα</b><br><br>Σ’ ένα σχολείο που κάθε μέρα συνέβαιναν διάφορες περιπέτειες, ήταν ένα κοριτσάκι που τον έλεγαν Ζηλιάρα. Αυτή πάντα ζήλευε  τα παιχνίδια, τα ρούχα και τα παπούτσια των άλλων παιδιών. Κάθε νέο πράγμα που έβλεπε της προκαλούσε μεγάλη επιθυμία να έχει και αυτή το ίδιο.    Μια μέρα ενώ η Ζηλιάρα ονειρευόταν ξανά τα ξένα παιχνίδια, η νεραϊδούλα Καθωσπρέπη πέταξε στο πλευρό της και ψιθύρισε:<br><br>-Ζηλιάρα, η αληθινή αξία δεν βρίσκεται στα πράγματα που κατέχεις. Η μοναδικότητα σου και η καρδιά σου είναι οι μεγαλύτεροι θησαυροί σου. Αγάπησε αυτό που έχεις και θα δεις πόσο ξεχωριστό είναι αυτό.<br><br>Η Ζηλιάρα σκεφτόταν αυτό που είπε η νεραϊδούλα Καθωσπρέπη  και σύντομα κατάλαβε ότι έχει δίκαιο.<br><br>Αυτή άρχισε να εκτιμά τα δικά της υπάρχοντα, βλέποντάς τα με διαφορετικό τρόπο. Τα παπούτσια της, της φαινόταν τώρα σαν υπέροχοι θησαυροί, γεμάτα με περιπέτειες και αναμνήσεις.<br><br>Την άλλη μέρα όταν τα παιδιά παίζανε στην αυλή η Ζηλιάρα αποφάσισε να πει στους φίλους της για το ραντεβού της με την Καθωσπρέπει. Αυτή άρχισε να γυρνάει και να χορεύει με τα “όμορφα της παπούτσια”. Εκείνη την στιγμή ένα περίεργο γατάκι που είχε έρθει στο σχολείο , πήδηξε και άρχισε να παίζει με τα κορδόνια των παπουτσιών της. Η Ζηλιάρα προσπάθησε να χορέψει μαζί με το γατάκι, αλλά σκόνταψέ και έπεσε στο γρασίδι, και γέλασε από καρδιάς με τα υπόλοιπα παιδιά.<br><br>Όλοι γελούσαν βλέποντας αυτή την αστεία σκηνή, και η Ζηλιάρα κατάλαβε πως η αληθινή χαρά, έρχεται όταν μοιράζεσαι  ευτυχισμένες στιγμές. Έμαθε πως η ευτυχία δεν βρίσκεται στο να έχεις πράγματα, αλλά στην δυνατότητα να χαίρεσαι τις στιγμές και να εκτιμάς αυτό που έχεις.<br><br>Από τότε η Ζηλιάρα έγινε γνωστή στο σχολείο για την χαρούμενη διάθεσή της  και για την δυνατότητα να βρίσκει την ευτυχία στα μικρά πράγματα. Χάρη στην Καθωσπρέπη  αυτή κατάλαβε πως κάθε παιδί είναι μοναδικό με το δικό του ξεχωριστό τρόπο.`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και ο Θρασύτατος</b><br><br>Στο μαγικό βασίλειο των σύννεφων, όπου οι νεράιδες χορεύουν ανάμεσα στα αστέρια, ζούσε η μικρή νεράϊδαΚαθωσπρέπει. Αυτή συχνά ανησυχούσε για τα παιδιά στην Γη ειδικά για αυτά που ξεχνούν τη σημασία του σεβασμού και της πειθαρχίας. Ανάμεσα σε αυτά τα παιδιά ήταν και ένα αγόρι που τον φώναζαν Θρασύτατο.<br><br>Στο σχολείο ο Θρασύτατος συχνά παραμελούσε τα μαθήματα των μαθηματικών.  Αυτός όχι μόνο δεν έδινε σημασία στον δάσκαλο του, αλλά δεν τον σεβόταν. Το αγόρι μιλούσε με τους συμμαθητές του κατά τη διάρκεια του μαθήματος , έπαιζε με το κινητό του και συχνά απαντούσε στην δασκάλα του αλαζονικά.<br><br>Μια μέρα στο μάθημα των μαθηματικών όταν ο Θρασύτατος είχε σηκώσει τα πόδια του στο θρανίο του, δίπλα του εμφανίστηκε η νεραϊδούλα Καθωσπρέπει, που ήταν λαμπερή σαν πρωινό αστέρι. Έκατσε στον ώμου του και του ψιθύρισε:<br><br>-Θρασύτατε, ξέρεις ότι ο σεβασμός και η εκτίμηση μπορούν να ξεκλειδώσουν τις πόρτες της γνώσης και της επιτυχίας; Όταν σέβεσαι τον δάσκαλό σου, σέβεσαι το μέλλον σου. Κάθε μάθημα είναι μια ευκαιρία να μάθετε κάτι νέο. Εξάλλου, η μελέτη είναι σαν τη γυμναστική για τον εγκέφαλο - όσο περισσότερο ασκείσαι, τόσο πιο γρήγορο και δυνατό θα είναι το μυαλό σου!<br><br>Αυτά τα λόγια άφησαν βαθιά εντύπωση στην καρδιά του Θρασύτατου. Συνειδητοποίησε ότι η συμπεριφορά του όχι μόνο τον εμπόδιζε να μάθει, αλλά δυσκόλευε τον δάσκαλο και τους άλλους μαθητές.<br><br>Από την επόμενη μέρα, ο Θρασύτατος άρχισε να αλλάζει και να εκπαιδεύει τον εγκέφαλό του. Άκουγε με προσοχή κατά τη διάρκεια των μαθημάτων, έκανε ερωτήσεις και συμμετείχε ενεργά σε συζητήσεις. Σύντομα βελτίωσε τους βαθμούς του και άρχισε να βρίσκει ευχαρίστηση στη μάθηση.<br><br>Οι γονείς και ο δάσκαλός του παρατήρησαν την αλλαγή και τον επαίνεσαν. Η δασκάλα μάλιστα τον βράβευσε με ειδικό βραβείο για τον πιο επιτυχημένο μαθητή του μήνα.<br><br>Μια μέρα η δασκάλα φώναξε τον Θρασύτατο να σηκωθεί στον πίνακα για να λύσει την άσκηση :5+5 = ; Ο Θρασύτατος ξεχάστηκε και τυχαία έγραψε 10 με ακόμα ένα μηδενικό – 5+5=100. Όλοι στην τάξη άρχισαν να γελάνε. Ο Θρασύτατος γρήγορα έγραψε στο μηδενικό δυο ματάκια και ένα χαμόγελο και το μηδενικό έγινε ένα χαμογελαστό ανθρωπάκι. Έτσι το αγόρι κατάφερε να κάνει  τους συμμαθητές  και τον δάσκαλό του να χαμογελάσουν. Κατάλαβε πως τα μαθηματικά μπορούν να είναι και διασκεδαστικά.<br><br>Από τότε ο Θρασύτατος έγινε παράδειγμα για τους άλλους μαθητές. Έμαθε πως ο σεβασμός για τους δασκάλους και για την μάθηση είναι σημαντικά βήματα για την επιτυχία. Χάρη στην νεραϊδούλα Καθωσπρέπη αυτός ανακάλυψε την χαρά της μάθησης και τη σημασία του σεβασμού.`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και η Δώρη</b><br><br>Σ’ ένα μαγικό βασίλειο, όπου οι νεράιδες πλέκουν όνειρα και δημιουργούν θαύματα, η νεραϊδούλα Καθωσπρέπη περνούσε τις μέρες της, φροντίζοντας για την καλοσύνη και τις καρδιές των ανθρώπων. Η Καθωσπρέπη συχνά στεναχωριόταν για τα παιδιά, ειδικά για αυτά που δεν ξέρουν τη σημασία της φιλίας και της καλής συμπεριφοράς.<br><br>Σ΄ ένα γήινο Δημοτικό σχολείο, στην Δευτέρα τάξη υπήρχε ένα κοριτσάκι, που τον λέγανε Δώρη.                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              Η Δώρη ήταν πολύ καλό παιδί, έτοιμο πάντα να βοηθήσει και να συμμετάσχει στην τάξη. Παρόλου αυτά τα άλλα κορίτσια στην τάξη αποφάσισαν να την απομονώσουν. Δεν την καλούσαν στα παιχνίδια τους και την απέφευγαν στα διαλείμματα. Η Δώρη ένιωθε μοναξιά και έτσι αποφάσισε  να παίξει ποδόσφαιρο με τα αγόρια, για να έχει με κάποιον να διασκεδάσει.<br><br>Μια μέρα όταν τα κορίτσια πάλι δεν έπαιζαν με τη Δώρη, δίπλα τους ήρθε η Καθωσπρέπει. Αυτή έκατσε σ΄                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       ένα δέντρο στην αυλή και άρχισε να μιλάει στα κορίτσια :<br><br>Γεια σας αγαπητά παιδιά! Ξέρετε πως κάθε παιδί είναι μοναδικό και εξαιρετικό; Όταν αποκλείετε κάποιον από τα παιχνίδια σας, χάνετε την ευκαιρία να μάθετε κάτι καινούργιο και συναρπαστικό για αυτόν τον άνθρωπο.<br><br>Τα κορίτσια άκουγαν με προσοχή και η Δώρη στάθηκε στο πλάι, έκπληκτη από την εμφάνιση της νεραϊδούλας.<br><br>Η Καθωσπρέπη συνέχισε:<br><br>Ο καθένας από σας είναι ξεχωριστός και αξίζει να είναι μέλος της ομάδας. Σκεφτείτε πόσα ακόμα διασκεδαστικά παιχνίδια και περιπέτειες μπορείτε να έχετε μαζί !<br><br>Μετά από αυτά τα λόγια της Καθωσπρέπει, τα κορίτσια κατάλαβαν το λάθος τους. Κάλεσαν την Δώρη να έρθει μαζί τους και αυτή δέχτηκε με χαρά την πρόσκληση.<br><br>Καθώς έπαιζαν ένα μικρό, έντονο κόκκινο πράγμα προσγειώθηκε στη μύτη της Δώρης. Όλοι σταμάτησαν και το κοίταξαν – ήταν μια μικρή πασχαλίτσα που έμοιαζε να χορεύει πάνω στη μύτη της .<br><br>Η Δώρη σταύρωσε τα μάτια της προσπαθώντας να δει την πασχαλίτσα και άρχισε να τριγυρνά πέρα δώθε σαν μάγος που προσπαθεί να κρατήσει την μπαλίτσα στην μύτη του.<br><br>Όλα τα κορίτσια ξέσπασαν σε δυνατά γέλια καθώς έβλεπαν τη Δώρη να περιστρέφεται, για να μην χάσει τον καινούργιο της φίλο. Σύντομα και η ίδια  η Δώρη χαμογέλασε, καθώς η πασχαλίτσα επιτέλους πέταξε  και προσγειώθηκε σε ένα από τα διπλανά λουλούδια.<br><br>Το γέλιο τους τράβηξε την προσοχή των υπόλοιπων μαθητών και καθηγητών, οι οποίοι γελούσαν στο θέαμα της ξεκαρδιστικής σκηνής. Αυτό το μικρό απροσδόκητο γεγονός με την πασχαλίτσα βοήθησε όλους να συνειδητοποιήσουν πόσο υπέροχο είναι, όταν μοιράζεσαι την ευτυχία και το γέλιο με άλλους.<br><br>Από τότε η Δώρη και τα άλλα κορίτσια έγιναν καλές φίλες και θυμούνται πάντα την ημέρα που η πασχαλίτσα τους έφερε τόσο χαρά και γέλιο. Έμαθαν πως η αληθινή αξία της φιλίας βρίσκεται στην κοινή χαρά και στον σεβασμό.`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και τα αγόρια της Δευτέρας τάξης</b><br><br>Σ’ ένα μαγικό βασίλειο όπου οι νεράιδες φρόντιζαν την φύση και την ομορφιά του κόσμου, ζούσε η νεραϊδούλα Καθωσπρέπει. Αυτή συχνά ανησυχούσε για τα παιδιά της Γης. Ειδικά για αυτά που δεν εκτιμούσαν την καθαριότητα. Η Καθωσπρέπη  ήξερε πως η καθαριότητα και ο σεβασμός στη φύση είναι απαραίτητοι για μια καλή ζωή.<br><br>Σε ένα σχολείο στη Γη, μια ομάδα αγοριών  της Δευτέρας Δημοτικού διασκέδαζαν και τσιμπολογούσαν το κολατσιό  τους κατά την διάρκεια του διαλείμματος. Αφού έφαγαν τις βάφλες	 τους, πέταξαν τα περιτυλίγματα κάτω, στην αυλή και ένα από τα παιδιά πέταξε ένα κουπάκι με γιαούρτι και το κλώτσησε στο γρασίδι. Καθώς πήγαιναν στην τάξη, τα παιδιά κλώτσησαν πολλές πόρτες και ζωγράφισαν ένα βέλος σε ένα τοίχο στο διάδρομο.<br><br>Γελούσαν και έπαιζαν ανέμελα, χωρίς να σκέφτονται τις συνέπειες των πράξεων τους.<br><br>Μια μέρα, ενώ τα αγόρια πετούσαν ξανά περιτυλίγματα από βάφλες και μπισκότα και άδεια μπουκάλια στο χορτάρι, δίπλα τους  προσγειώθηκε η νεραϊδούλα Καθωσπρέπει. Προσγειώθηκε σε ένα παγκάκι κάτω από την ιτιά στην αυλή του σχολείου και μίλησε στα αγόρια:<br><br>Γειά σας παιδιά! Ξέρετε πως κάθε σας ενέργεια αφήνει ένα αποτύπωμα στον όμορφο κόσμο μας; Τα αγόρια σταμάτησαν και άκουγαν προσεκτικά αυτή την μαγική νεραϊδούλα. Τότε η Καθωσπρέπη συνέχισε:<br><br>Κάθε συσκευασία που πετάτε, κάθε πατημασιά παπουτσιού στον βαμμένο τοίχο, αφαιρούν από την ομορφιά του σχολείου σας. Χαλάει την  όμορφη ατμόσφαιρα για σας, τους δασκάλους και τους γονείς σας. Μήπως οι μητέρες σας δεν αγαπούν την καθαριότητα και την ομορφιά;<br><br>Evώ μιλούσαν μια δασκάλα πήγε στην Διευθύντρια του σχολείου και είπε τι έχουν κάνει τα παιδιά. Η Διευθύντρια αποφάσισε ότι είναι η ώρα για μια μικρή τιμωρία. Διέταξε τα αγόρια να καθαρίσουν όλη την αυλή και το γρασίδι γύρω από το σχολείο.<br><br>Όσο καθάριζαν ένα αγόρι τυχαία αναποδογύρισε ένα κουπάκι με γιαούρτι που ήταν στα σκουπίδια πάνω στα παπούτσια του.<br><br>Όλοι γέλασαν όταν τον είδαν να προσπαθεί να καθαρίσει το λευκό και βρομερό γιαούρτι από τα παπούτσια του.<br><br>Αυτή η αστεία στιγμή τους έκανε να καταλάβουν πως η ομαδική εργασία μπορεί να είναι και διασκεδαστική. Επίσης είναι απαίσιο να ζεις μέσα στα σκουπίδια και στη μιζέρια.<br><br>Τα αγόρια αποφάσισαν να ακολουθήσουν τις συμβουλές της νεραϊδούλας και άρχισαν να φροντίζουν το σχολείο τους, να αγαπάνε την καθαριότητα και την φύση. Κατάλαβαν πως κάθε πράξη τους έχει σημασία και συνέπειες. Συνειδητοποίησαν ότι η τήρηση των κανόνων στο σχολείο είναι καθήκον τους ως μαθητές.<br><br>Χάρη στα μαθήματα της Καθωσπρέπη και την αστεία εμπειρία με το γιαούρτι, τα αγόρια έμαθαν πόσο σημαντικό είναι να τηρούν τους κανόνες και την καθαριότητα στο σχολείο.<br><br>Έχετε πετάξει σκουπίδια στην αυλή του σχολείου; Και στο δρόμο;<br><br>Τι θα κάνετε αν βλέπατε μπροστά σας ένα παιδί να πετάει το χαρτί από το κολατσιό του στην αυλή του σχολείου;`},
          {q:`<b>Η επίσκεψη της νεραϊδούλας Καθωσπρέπη στον Δήμο και την Άννυ</b><br><br>Σ’ ένα μαγικό βασίλειο, όπου κάθε μέρα είναι γεμάτη με μαγεία και μάγια η νεραϊδούλα Καθωσπρέπη προσεκτικά παρακολουθούσε τα παιδιά της Γης. Αυτή συχνά ανησυχούσε για όσα παιδιά ξεχνούν να βοηθήσουν στις δουλειές του σπιτιού και αφήνουν τα πάντα στους γονείς τους.<br><br>Σε ένα απλό σπίτι ο Δήμος 8 χρονών και η αδελφή του η Άννυ 12 χρονών, συχνά αμελούσαν να αναλάβουν τις δουλειές του σπιτιού  .  Δεν θέλανε να τακτοποιούν το δωμάτιο και την ντουλάπα τους, να διπλώσουν τα πλυμένα ρούχα ή να βοηθήσουν στο σερβίρισμα του φαγητού. Όλα αυτά τα άφηναν στην μητέρα τους, που συχνά ήταν κουρασμένη από τις ατέλειωτες δουλειές που μαζεύονταν στο σπίτι.<br><br>Ένα βράδυ όταν η μητέρα τους πάλι ετοίμαζε το βραδινό και ο Δήμος και η Άννυ παίζανε στα κινητά τους, εμφανίστηκε η Καθωσπρέπει. Μπήκε ως ακτίνα ηλίου από το παράθυρο και έκατσε στον ώμο του Δήμου.<br><br>Γεια σας Δήμο και Άννυ! – ψιθύρισε αυτή..- Ξέρετε πως η βοήθεια στις δουλειές του σπιτιού μπορεί να είναι διασκεδαστική και να προκαλεί χαρά;<br><br>Τα παιδιά την κοιτούσαν με απορία και η Καθωσπρέπη συνέχισε : - Γιατί δεν προσπαθείτε να παίξετε ένα παιχνίδι στρώνοντας το τραπέζι ή διπλώνοντας τα ρούχα; Κάθε συμμετοχή σας στις δουλειές του σπιτιού, θα κάνει τη μαμά χαρούμενη  και θα σας διδάξει υπευθυνότητα και αγάπη. Έτσι η μαμά θα έχει περισσότερο χρόνο για διασκέδαση και συζητήσεις μαζί σας.<br><br>Την άλλη μέρα ο Δήμος και η Άννυ αποφάσισαν να προσπαθήσουν. Έστρωσαν το τραπέζι ενώ συναγωνίζονταν για το ποιος θα τακτοποιήσει τα μαχαιροπίρουνα πιο γρήγορα. Ενώ βιαζόταν ο Δήμος ανέτρεψε κατά λάθος ένα πιάτο, το οποίο κύλησε στο πάτωμα σαν φρίσμπι. Αυτό κατρακύλησε μέχρι που τελικά σταμάτησε ακριβώς στα πόδια της μητέρας τους. Αντί να φωνάξει, η μαμά άρχισε να γελάει και όλοι γελούσαν για πολλή ώρα μετά.<br><br>Ενώ δίπλωναν την μπουγάδα, η Άννυ αποφάσισε να φτιάξει ένα σπίτι με την παπλωματοθήκη και ο Δήμος μπήκε μέσα και προσποιήθηκε ότι ήταν φάντασμα. Διασκέδαζαν ενώ παράλληλα βοηθούσαν και έτσι συνειδητοποίησαν ότι οι δουλειές του σπιτιού μπορούν να γίνουν η ευκαιρία για ένα υπέροχο παιχνίδι.<br><br>Με τον καιρό ο Δήμος και η Άννυ έγιναν πιο υπεύθυνοι και βοηθούσαν την μητέρα τους χωρίς να χρειαστεί να τους παρακαλεί. Έμαθαν ότι ακόμη και οι μικρές πράξεις κάνουν τους γονείς χαρούμενους.<br><br>Χάρη στην Καθωσπρέπη ο Δήμος και η Άννυ κατάλαβαν ότι η βοήθεια στο σπίτι δεν είναι μόνο υποχρέωση, αλλά και ένας τρόπος να δείξουν αγάπη και σεβασμό στην οικογένειά τους. Έμαθαν να εκτιμούν τις προσπάθειες της μητέρας τους και να φροντίζουν το σπίτι τους με χαρά.<br><br>Εσείς βοηθάτε στο σπίτι;<br><br>Ποια είναι η αγαπημένη σου δουλειά στο σπίτι;<br><br>Ποιες δουλειές του σπιτιού σας βαραίνουν περισσότερο;`},
          {q:`<b>Η νεραϊδούλα Καθωσπρέπη και οι αδελφές η Τεμπέλα, η Ιδιότροπη και η Κακιά</b><br><br>Σ’ ένα μακρινό μαγικό βασίλειο των σύννεφων η μικρή νεραϊδούλα  Καθωσπρέπη παρακολουθούσε τα παιδιά της Γης. Αυτή ήταν η θεματοφύλακας  των καλών τρόπων και νοιάζονταν για την ευτυχία και την καλοσύνη τους. Από το βασίλειο της παρατήρησε πως οι τρείς αδελφές, η Τεμπέλα, η Ιδιότροπη και η Κακία, χρειάζονται την βοήθειά της.<br><br>Η Ιδιότροπη, η μικρότερη, πάντα ήθελε τα πράγματα να γίνονται όπως τα ήθελε αυτή. Στο σχολείο αρνιόταν να συνεργαστεί με τα άλλα παιδιά και στο σπίτι θύμωνε αν δεν έπαιρνε ακριβώς αυτό που ήθελε.<br><br>Η Τεμπέλα, η μεσαία αδελφή συνέχεια παραμελούσε τα καθήκοντά της.<br><br>Δεν βοηθούσε στις δουλειές του σπιτιού και συχνά δεν πήγαινε ούτε στο σχολείο.<br><br>Η Κακιά, η μεγαλύτερη μιλούσε συχνά με άσχημα λόγια πίσω από τις πλάτες τους και διέδιδε διάφορα κουτσομπολιά.<br><br>Η Καθωσπρέπη τους μίλησε για την δύναμη των καλών λέξεων, την προσπάθεια και  την αληθινή φιλία.<br><br>Ένα βράδυ ενώ είχαν πάει επίσκεψη στην γιαγιά τους, μπροστά τους εμφανίστηκε η Καθωσπρέπη και αποφάσισε να μιλήσει με κάθε μια από τις αδελφές ξεχωριστά.<br><br>Στην Ιδιότροπη είπε:<br><br>Ξέρεις πως όταν σκεφτόμαστε τους άλλους όλοι νιώθουμε πιο ευτυχισμένοι; Το να μοιράζεσαι και να είσαι ευγενικός είναι το καλύτερο πράγμα στον κόσμο!<br><br>Στην Τεμπέλα η Καθωσπρέπη είπε:<br><br>Ακόμα και η πιο μικρή προσπάθεια μπορεί να φέρει μεγάλη χαρά, Τεμπέλα μου. Όταν βοηθάς κάνεις τους ανθρώπους να νιώθουν σημαντικοί για σένα και να σου ανταποδίδουν το καλό που τους κάνεις.<br><br>Και στο τέλος στην Κακιά :<br><br>Οι αληθινοί φίλοι μιλάνε με καλά λόγια για τους φίλους τους Κακιά μου. Όταν μιλάς όμορφα κι ευγενικά οι καρδιές ό<br><br>λων φωτίζονται.<br><br>Μετά από αυτή την συνάντηση οι αδελφές άρχισαν να αλλάζουν. Η Ιδιότροπη έγινε πιο καλή και δοτική. Η Τεμπέλα άρχισε να βοηθάει περισσότερο και η Κακιά άλλαξε τον τρόπο με τον οποίο μιλούσε με τους άλλους και κέρδισε αληθινούς φίλους.<br><br>Στο σχολείο οι συμμαθητές  τους πρόσεξαν την διαφορά και άρχισαν να τις σέβονται περισσότερο και να τις εκτιμούν. .<br><br>Τέλος, για να δείξουν τη νέα τους στάση, οι αδερφές οργάνωσαν μια διασκεδαστική παράσταση στο σχολείο. Οι ρόλοι τους έδειχναν τους «κακούς» χαρακτήρες τους και τα κορίτσια χλεύαζαν τους χαρακτήρες που είχαν στο παρελθόν. Έγιναν «σταρ» στη σκηνή ενώ αυτοσαρκάζονταν για τις δικές τους αδυναμίες. Όλοι γέλασαν από καρδιάς.<br><br>Από εκείνη την ημέρα, οι αδερφές άλλαξαν και άρχισαν να κάνουν αυτό που τους είπε η Καθωσπρέπει. Έγιναν παράδειγμα για τους συμμαθητές τους και επαινούνταν από όλους για τη νέα τους συμπεριφορά. Στο τέλος, όλοι κατάλαβαν ότι το να είσαι καλός και να σκέφτεσαι τους άλλους φέρνει ευτυχία και στον εαυτό σου.<br><br>Έχετε ιδιότροπους φίλους ή τεμπέληδες ή κακούς;<br><br>Εσείς ήσασταν κάποτε ιδιότροποι, τεμπέληδες ή κακοί;`}
        ]

          {q:`Στην πόλη σας διοργανώνεται μια  φιλανθρωπική εκδήλωση για μια παιδική ποδοσφαιρική ομάδα.<br>Ερώτηση: Πώς θα βοηθήσετε να μαζευτούν περισσότερα χρήματα;<br>Για παράδειγμα: Θα ενημερώσω για το γεγονός πολλούς γνωστούς και φίλους.  Με αυτόν τον τρόπο  περισσότεροι άνθρωποι θα ξέρουν για την εκδήλωση και θα μπορούν να βοηθήσουν.  Μπορώ να δώσω από τα χρήματα που έχω πάρει από φίλους ή συγγενείς για τα γενέθλιά    μου ή την ονομαστική μου γιορτή και εγώ ώστε να βοηθήσω.`},

          {q:`Ο σκαντζόχοιρος άνοιξε καινούργιο μαγαζί με μανιτάρια στο δάσος. Ήρθε ο λαγός και του είπε:<br>- Σκαντζόχοιρε, δώσε μου 5 κιλά καρότα.<br>- Λαγέ, αυτό είναι μαγαζί με μανιτάρια – απάντησε ο σκαντζόχοιρος.<br>Την δεύτερη μέρα ο λαγός  πήγε πάλι.<br>- Σκαντζόχοιρε, δώσε μου 5 κιλά καρότα.<br>- Λαγέ, σου είπα και χθες -  αυτό είναι μαγαζί με μανιτάρια.<br>Την τρίτη, τέταρτη και την πέμπτη μέρα έγινε το ίδιο.Την έκτη μέρα όταν ο λαγός μπήκε στο μαγαζί και ρώτησε για 5 κιλά καρότα, ο σκαντζόχοιρος θύμωσε και απάντησε:<br>- Λαγέ, κάθε μέρα σου λέω πως αυτό είναι μαγαζί με μανιτάρια, και αν έρθεις ξανά να μου ζητήσεις καρότα θα σου καρφώσω τα αυτιά με καρφιά στοτοίχο.<br>Την άλλη μέρα στο μαγαζί μπαίνει ο Λαγός.<br>- Καλημέρα σκαντζόχοιρε!<br>- Καλημέρα λαγέ.<br>- Έχεις καρφιά – ρώτησε ο λαγός.<br>Ο σκαντζόχοιρος αναστέναξε βαθιά και είπε:<br>- Δεν έχω λαγέ.<br>- Δώσε μου τότε 5 κιλά καρότα.`},

          {q:`Η Βίκυ δεν είχε ποτέ ιδιαίτερη προτίμηση για το φαγητό στο σχολικό εστιατόριο. Ωστόσο, μια μέρα, προς μεγάλη έκπληξη όλων, εξέφρασε ενδιαφέρον. Παρακάλεσε τη μητέρα της να την εγγράψει για μεσημεριανό, επειδή της άρεσε η φασολάδα. Η μητέρα της συμφώνησε να πληρώσει μόνο για εκείνη την ημέρα, προκειμένου να δει αν τελικά θα της αρέσει. Μετά το σχολείο αυτή την περίμενε και ρώτησε αμέσως με ανυπομονησία:<br>– Σου άρεσε η φασολάδα;<br>Η Βίκυ απάντησε :<br>– Ναι μου αρέσει πολύ.<br>Η μητέρα της χάρηκε από την απάντηση αυτή και αμέσως τη πρότεινε να την γράψει ξανά. Αλλά αντί να συμφωνήσει η Βίκυ την κοίταξε και είπε:<br>– Μαμά, σίγουρα έχεις παρκάρει νόμιμα; Γιατί είδα έναν τροχονόμο να γράφει. Ας φύγουμε γρήγορα.<br>Από τότε δεν ζήτησε να πάει ξανά στο εστιατόριο.<br><i>Συγγραφέας: Βικτόρια Δανιήλοβα, 9 χρονών, χωριό Δίνκατα</i>`},
